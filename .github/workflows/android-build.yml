name: Build Android APK

on:
  push:
    branches: [ "main", "security-offline-fcm" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Debug APK using wrapper jar
      run: java -jar gradle/wrapper/gradle-wrapper.jar assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mkr-2.0-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
