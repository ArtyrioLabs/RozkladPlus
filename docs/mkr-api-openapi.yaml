      description: 'Получение списка ведомостей, к которым текущий преподавтель имеет доступ'
      operationId: getExamSheets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamSheetsForm'
      responses:
        '200':
          description: 'Список ведомостей'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sheet'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
