openapi: 3.0.0
info:
  title: 'MKR portal RestAPI'
  description: 'Описание методов для RestAPI веб-портала АСУ МКР'
  contact:
    name: Support
    email: support@mkr.org.ua
  version: 1.6.1
paths:
  /academ/disciplines:
    post:
      tags:
        - Academ
      summary: 'Получение полного списка дисциплин.'
      description: 'Получение полного плоского списка дисциплин.'
      operationId: getAcademDisciplines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademDisciplinesForm'
      responses:
        '200':
          description: 'Список дисциплин в выбранном учебном году и семестре'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademDisciplineFull'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
  /academ/learning-plans:
    post:
      tags:
        - Academ
      summary: 'Получение учебных планов в выбранном учебном году и семестре по выбранным дисциплинам.'
      description: 'Получение учебных планов в выбранном учебном году и семестре по выбранным дисциплинам.'
      operationId: getAcademLearningPlans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademLearningPlansForm'
      responses:
        '200':
          description: 'Учебный планы в выбранном учебном году и семестре по выбранным дисциплинам'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademDiscipline'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
  /docs/get-new-docs:
    get:
      tags:
        - Docs
      summary: 'Получить новые документы для пользователя'
      description: 'Получить новые документы для пользователя'
      operationId: getGetNewDocs
      responses:
        '200':
          description: 'Список новых документов для пользователя'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /docs/mark-docs-as-read:
    put:
      tags:
        - Docs
      summary: 'Пометить документы как прочитанные'
      description: 'Пометить документы как прочитанные'
      operationId: getMarkDocsAsRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkDocsForm'
      responses:
        '204':
          description: 'Успешный запрос'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /docs/get-docs-on-control:
    post:
      tags:
        - Docs
      summary: 'Получить документы на контроле, в которых текущий пользователь является исполнителем'
      description: 'Получить документы на контроле, в которых текущий пользователь является исполнителем'
      operationId: getDocsOnControl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocsOnControlForm'
      responses:
        '200':
