          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentControl'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
