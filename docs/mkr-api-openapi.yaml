      description: 'Получить Список типов справок'
      operationId: getInquiriesTypes
      parameters:
        -
          name: facultyId
          in: query
          description: 'Код факультета, если не задан отобаржаются общеуниверситесткие типы справок'
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 'Типы справок'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InquiryType'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /journal/student:
