components:
  schemas:
    ErrorModel:
      properties:
        name:
          description: 'Название ошибки'
          type: string
        message:
          description: 'Текст ошибки'
          type: string
        code:
          description: 'Код ошибки'
          type: integer
        status:
          description: 'http статус ответа'
          type: integer
      type: object
    ErrorValidationField:
      properties:
        field:
          description: 'Название поля'
          type: string
        message:
          description: 'Текст ошибки'
          type: string
      type: object
    Version:
      description: 'Моделька для версии'
      properties:
        name:
          description: Версия
          type: string
        code:
          description: 'код версии'
          type: string
      type: object
    AcademForm:
      description: 'форма фильтрации дисциплин учебного плана'
      required:
        - year
        - semester
      properties:
        year:
          description: 'Учебный год'
          type: integer
        semester:
          description: Семестр
          type: integer
      type: object
    AcademDisciplinesForm:
      description: 'форма для получения учебных планов по дисциплине'
      required:
        - year
        - semester
      allOf:
        -
          properties:
            lastId:
              type: integer
          type: object
        -
          $ref: '#/components/schemas/AcademForm'
    AcademLearningPlansForm:
      description: 'форма для получения учебных планов по дисциплине'
      required:
        - disciplinesId
        - year
        - semester
      allOf:
        -
          properties:
            disciplinesId:
              description: 'список кодов дисциплин'
              type: array
              items:
                type: integer
          type: object
        -
          $ref: '#/components/schemas/AcademForm'
    AuthDataForm:
      description: 'форма для авторизации для внешних систем'
      required:
        - username
        - password
        - key
      properties:
        username:
          description: username
          type: string
        password:
          description: password
          type: string
        key:
          description: 'ключ внешней системы'
          type: string
      type: object
    AuthData:
      description: 'Данные авторизации'
      properties:
        username:
          description: логин
