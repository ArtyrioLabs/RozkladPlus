      description: 'Моделька для студента (связь с другими системами)'
      properties:
        id:
          description: 'id обучения студента'
          type: integer
        hash:
          description: hash
          type: string
      type: object
    TeacherIdentifier:
      description: 'Моделька для преподавателей (связь с другими системами)'
      properties:
        id:
          description: 'id преподавателя'
          type: integer
        hash:
          description: hash
          type: string
      type: object
    TeacherSearch:
      description: 'форма поиска преподавателя по имени'
      required:
        - name
      properties:
        name:
          description: 'строка для поиска'
          type: string
      type: object
    MarkDocsForm:
      description: 'форма для пометки документов как прочитанного'
      required:
        - docs
      properties:
        docs:
          description: 'список кодов документов'
          type: array
          items:
            type: integer
      type: object
    DocsOnControlForm:
      description: 'форма для получения списка документов на контроле'
      required:
        - countDays
      properties:
        countDays:
          description: 'За сколько дней до необходимой даты отображать'
          type: integer
      type: object
  responses:
    '500':
      description: InternalServerError
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '400':
      description: BadRequest
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '422':
      description: 'Validation error'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ErrorValidationField'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
