      responses:
        '200':
          description: 'Список ведомостей'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatementList'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
  /exam/set-date-enter:
    put:
      tags:
        - Exam
      summary: 'Проставить дату сдачи для ведомости'
      description: 'Проставление даты сдачи для итоговой ведомости'
      operationId: setSheetDateEnter
      parameters:
        -
          name: sheetId
          in: query
          description: 'Код ведомости'
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSheetDateEnterForm'
      responses:
        '422':
          $ref: '#/components/responses/422'
        '204':
          description: 'Дата сдачи установлена'
        '500':
          $ref: '#/components/responses/500'
        '401':
          $ref: '#/components/responses/401'
        '400':
          $ref: '#/components/responses/400'
  /exam/close:
    post:
      tags:
        - Exam
      summary: 'Закрытие ведомости.'
      description: 'Закрыть ведомость для редактирования'
      operationId: closeExamSheet
      parameters:
        -
          name: sheetId
          in: query
          description: 'Код ведомости'
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 'Ведомость закрыта'
        '500':
          $ref: '#/components/responses/500'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /exam/set-marks:
    put:
      tags:
        - Exam
