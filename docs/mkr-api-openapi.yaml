      description: 'Проставление итоговых оценок студентов в ведомость'
      operationId: setSheetMarks
      parameters:
        -
          name: sheetId
          in: query
          description: 'Код ведомости'
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSheetMarksForm'
      responses:
        '204':
          description: 'Оценки проставлены'
        '500':
          $ref: '#/components/responses/500'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /inquiry/types:
